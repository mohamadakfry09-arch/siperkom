<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="siperkomNavy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#072544"/>
            <stop offset="100%" stop-color="#0B3D6E"/>
        </linearGradient>

        <linearGradient id="siperkomScreen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0c355f"/>
            <stop offset="100%" stop-color="#07223e"/>
        </linearGradient>

        <linearGradient id="siperkomGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F3DC87"/>
            <stop offset="40%" stop-color="#C9A227"/>
            <stop offset="100%" stop-color="#9A7512"/>
        </linearGradient>

        <linearGradient id="siperkomCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#56CCF2"/>
            <stop offset="100%" stop-color="#2F80ED"/>
        </linearGradient>

        <linearGradient id="siperkomGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>

        <!-- Drop Shadow Filters -->
        <filter id="shadowSoft" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072544" flood-opacity="0.25"/>
        </filter>
        
        <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C9A227" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Base Squircle Badge with Subtle Keraton Gold Ring -->
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#siperkomNavy)" filter="url(#shadowSoft)"/>
    <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="url(#siperkomGold)" stroke-width="4" opacity="0.65"/>
    
    <!-- Mega Mendung Decorative Cloud Waves (Subtle Background Geometry) -->
    <path d="M 64 340 C 90 320, 130 320, 155 340 C 180 360, 220 360, 245 340 C 270 320, 310 320, 335 340 C 360 360, 400 360, 448 335" 
          fill="none" stroke="#2E9EC4" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
    <path d="M 80 365 C 105 348, 140 348, 165 365 C 190 382, 225 382, 250 365 C 275 348, 310 348, 335 365 C 360 382, 395 382, 432 360" 
          fill="none" stroke="url(#siperkomGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.28"/>

    <!-- ================= MONITOR COMPUTER ================= -->
    <!-- Monitor Outer Body -->
    <rect x="100" y="85" width="312" height="225" rx="22" fill="#FFFFFF" filter="url(#shadowSoft)"/>
    
    <!-- Inner Screen Bezel -->
    <rect x="114" y="99" width="284" height="175" rx="14" fill="url(#siperkomScreen)"/>
    
    <!-- Camera Dot & Status Ambient Light -->
    <circle cx="256" cy="92" r="3.5" fill="#C9A227"/>
    <circle cx="256" cy="281" r="2.5" fill="#56CCF2"/>

    <!-- ================= ICON INSIDE SCREEN: GEAR & WRENCH ================= -->
    <!-- Rotating Gear Symbol (Keraton Gold) -->
    <g transform="translate(256, 178)" filter="url(#shadowGlow)">
        <!-- 8 Teeth Gear -->
        <path d="M -16 -62 L 16 -62 L 20 -44 C 29 -41, 37 -36, 44 -30 L 60 -38 L 82 -16 L 74 0 C 76 9, 76 18, 74 27 L 82 43 L 60 65 L 44 57 C 37 63, 29 68, 20 71 L 16 89 L -16 89 L -20 71 C -29 68, -37 63, -44 57 L -60 65 L -82 43 L -74 27 C -76 18, -76 9, -74 0 L -82 -16 L -60 -38 L -44 -30 C -37 -36, -29 -41, -20 -44 Z"
              fill="url(#siperkomGold)" 
              transform="scale(0.72)"/>
        <!-- Inner Gear Hole -->
        <circle cx="0" cy="9" r="28" fill="url(#siperkomScreen)"/>
        
        <!-- Precision Wrench (White with Metallic Cutout) -->
        <g transform="rotate(45, 0, 9)">
            <!-- Handle -->
            <rect x="-8" y="-12" width="16" height="56" rx="8" fill="#FFFFFF"/>
            <circle cx="0" cy="36" r="4.5" fill="#0c355f"/>
            <!-- Wrench Head -->
            <path d="M -18 -10 C -22 -25, -12 -38, 0 -38 C 12 -38, 22 -25, 18 -10 C 16 -5, 12 -2, 7 -2 L 7 -18 L -7 -18 L -7 -2 C -12 -2, -16 -5, -18 -10 Z" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Monitor Stand & Base -->
    <path d="M 230 310 L 282 310 L 290 350 L 222 350 Z" fill="#E2E8F0"/>
    <rect x="180" y="348" width="152" height="14" rx="7" fill="#CBD5E1"/>
    <rect x="210" y="352" width="92" height="6" rx="3" fill="url(#siperkomGold)"/>

    <!-- ================= FLOATING CHECKMARK / ACTIVE STATUS BADGE ================= -->
    <g transform="translate(375, 275)" filter="url(#shadowSoft)">
        <circle cx="0" cy="0" r="34" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="28" fill="url(#siperkomGreen)"/>
        <!-- Clean Vector Checkmark -->
        <path d="M -11 0 L -3 8 L 13 -8" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ================= TYPOGRAPHY: SIPERKOM ================= -->
    <text x="256" y="420" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#FFFFFF" 
          text-anchor="middle">SIPERKOM</text>

    <!-- Official Tagline with Gold Divider Dots -->
    <text x="256" y="448" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="2.5" 
          fill="url(#siperkomGold)" 
          text-anchor="middle">KABUPATEN CIREBON</text>
</svg>
